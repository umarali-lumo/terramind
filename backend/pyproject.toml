[project]
name = "terramind-api"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    # Serverless (Vercel) deployment dependencies.
    # Same as requirements-render.txt minus uvicorn (Vercel's Python runtime
    # drives the ASGI app directly) and minus the PyTorch / transformers AI
    # stack, which cannot ship in a serverless bundle. Local / full installs
    # (with the disease model) use the repository-root requirements.txt.
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyJWT>=2.8",
    "httpx>=0.27",
    "pillow>=10.3",
]

[tool.vercel]
entrypoint = "asgi:app"
